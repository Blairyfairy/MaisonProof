name = "MaisonProof Verification"
client_id = "REPLACE_WITH_SHOPIFY_CLIENT_ID"
application_url = "https://REPLACE_WITH_APP_HOST"
embedded = true

[access_scopes]
scopes = "read_products"

[auth]
redirect_urls = ["https://REPLACE_WITH_APP_HOST/auth/callback"]

[webhooks]
api_version = "2026-10"

[[webhooks.subscriptions]]
topics = ["products/create", "products/update"]
uri = "https://REPLACE_WITH_API_HOST/v1/shopify/webhook"

[app_proxy]
url = "https://REPLACE_WITH_APP_HOST/proxy"
subpath = "maisonproof"
prefix = "apps"
